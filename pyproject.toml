[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driftcheck-py"
version = "0.1.52"
description = "Detect version drift between docs and toolchain files (README vs Dockerfile, build.gradle, rust-toolchain.toml, package.json, etc.)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yunare Maia", email = "yunare@gmail.com" }]
keywords = [
    "version-drift",
    "documentation-drift",
    "readme-lint",
    "rust-toolchain",
    "toml",
    "docker",
    "github-actions",
    "pre-commit",
    "monorepo",
    "ci",
    "static-analysis",
    "documentation",
    "consistency",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Utilities",
]
dependencies = [
    "packaging>=23.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
driftcheck = "driftcheck.cli:main"

[project.urls]
# Homepage is the documentation site, not the repository: PyPI already renders
# the source next to this list, so the prominent slot earns its place by pointing
# at the guides a visitor actually lands on.
Homepage = "https://yunaremaia.github.io/driftcheck/"
Documentation = "https://yunaremaia.github.io/driftcheck/getting-started/"
Source = "https://github.com/yunaremaia/driftcheck"
Issues = "https://github.com/yunaremaia/driftcheck/issues"
Changelog = "https://github.com/yunaremaia/driftcheck/blob/main/CHANGELOG.md"
Funding = "https://github.com/sponsors/yunaremaia"

[tool.pytest.ini_options]
# --cov lives here (not in the CI command line) so a local `pytest -q` and the
# CI run measure exactly the same thing. The gate itself is the fail_under key
# in [tool.coverage.report] below - do not duplicate it as --cov-fail-under.
addopts = "--cov=driftcheck --cov-report=term-missing"

[tool.ruff]
# ruff is not formatted by hand: only the selected rules below are enforced, so
# a ruff upgrade cannot widen the gate on its own.
target-version = "py310"
line-length = 120
# src/ is the linted surface: tests are deliberately excluded so this gate never
# pressures a future change into weakening or deleting a test. CI passes the
# path explicitly too, so the gate holds even if this key is dropped.
include = ["src/**/*.py"]
# tests/ is excluded from the `F` gate above on purpose, and stays excluded.
# It gets ONE narrower gate instead, F821 (undefined name), passed explicitly
# by CI as `ruff check --select=F821 --config 'include = ["tests/**/*.py"]' tests/`.
# An undefined name is not a style opinion: it is a NameError the moment that
# line runs, so this rule cannot pressure anyone into weakening or deleting a
# test - it only catches code that was already broken. It is scoped separately
# because the rest of pyflakes over tests/ is mostly style debt (F401/F811),
# and gating that would reintroduce exactly the pressure the `F` gate avoids.
# Keep it separate so widening one never silently widens the other.

[tool.ruff.lint]
# Scoped to pyflakes (F) on purpose. F is the subset that finds real defects -
# undefined names, dead imports, stale __all__ entries - and src/ is clean under
# it. The wider E501/I001/UP/B set is still ~810 findings of pre-existing style
# debt; it is recorded in BACKLOG.md and ratcheted in later, so this gate stays
# reviewable instead of arriving as an unreviewable reformat. Widen `select`
# when that debt is paid down.
select = ["F"]

[tool.ruff.lint.per-file-ignores]
# None today. Every F finding in src/ was fixed at the source rather than
# exempted; do not add a blanket entry here - fix the import or, for a genuine
# re-export, add the name to that module's __all__.

[tool.coverage.run]
# Statement coverage, matching what `pytest --cov=driftcheck` measured when the
# floor below was chosen. Branch coverage is a stricter metric; turning it on
# drops the total and needs the floor re-derived from a fresh measurement.
source = ["driftcheck"]

[tool.coverage.report]
# The floor is enforced from this file, never from a CI flag, so there is a
# single source of truth. Measured total on main is 89.56%; coverage rounds the
# total to a whole percent before comparing, so keep this strictly below the
# rounded total (90) or the gate loses its margin.
fail_under = 89
show_missing = true
skip_covered = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["driftcheck*"]
