[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driftcheck-py"
version = "0.1.49"
description = "Detect version drift between docs and toolchain files (README vs Dockerfile, build.gradle, rust-toolchain.toml, package.json, etc.)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yunare Maia", email = "yunare@gmail.com" }]
keywords = ["drift", "docs", "version", "consistency", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "packaging>=23.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
driftcheck = "driftcheck.cli:main"

[project.urls]
Homepage = "https://github.com/yunaremaia/driftcheck"

[tool.setuptools.packages.find]
where = ["src"]
include = ["driftcheck*"]
