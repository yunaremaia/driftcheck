site_name: driftcheck
# Required for mkdocs to emit sitemap.xml entries and <link rel="canonical">.
# Without it the build still succeeds and sitemap.xml is written as a valid but
# EMPTY urlset, which silently removes the site from sitemap-based discovery.
site_url: https://yunaremaia.github.io/driftcheck/
repo_name: yunaremaia/driftcheck
repo_url: https://github.com/yunaremaia/driftcheck
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.tracking
    - navigation.tabs
    - search.suggest
    - search.highlight

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - admonition
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Usage: usage.md
  - Detectors: detectors.md
  - API Reference: api.md
  - Configuration: configuration.md
  - Plugins: plugins.md
  - CI: ci.md

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yunaremaia/driftcheck
