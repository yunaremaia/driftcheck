name: Driftcheck
on:
  workflow_call:
    inputs:
      path:
        description: 'Repository root to scan'
        required: false
        type: string
        default: '.'
      detectors:
        description: 'Comma-separated list of detectors to run (default: all)'
        required: false
        type: string
        default: ''
      exclude:
        description: 'Comma-separated list of detectors to exclude'
        required: false
        type: string
        default: ''
      fail-on-drift:
        description: 'Fail the job if blocking drifts are found'
        required: false
        type: boolean
        default: true
      fail-on-informational:
        description: 'Treat informational drifts as blocking'
        required: false
        type: boolean
        default: false
      output-format:
        description: 'Output format: text, json, csv, sarif'
        required: false
        type: string
        default: 'text'
      sarif-upload:
        description: 'Upload SARIF to GitHub Code Scanning'
        required: false
        type: boolean
        default: false
    secrets: {}

jobs:
  driftcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Cache driftcheck installation
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip/driftcheck
          key: ${{ runner.os }}-driftcheck-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-driftcheck-

      - name: Install driftcheck
        run: pip install git+https://github.com/yunaremaia/driftcheck.git

      - name: Build driftcheck args
        id: args
        shell: bash
        run: |
          ARGS=""
          if [ -n "${{ inputs.detectors }}" ]; then
            ARGS="$ARGS --only ${{ inputs.detectors }}"
          fi
          if [ -n "${{ inputs.exclude }}" ]; then
            ARGS="$ARGS --exclude ${{ inputs.exclude }}"
          fi
          if [ "${{ inputs.fail-on-informational }}" = "true" ]; then
            ARGS="$ARGS"
          else
            ARGS="$ARGS --no-informational"
          fi
          if [ "${{ inputs.output-format }}" = "json" ]; then
            ARGS="$ARGS --json"
          elif [ "${{ inputs.output-format }}" = "csv" ]; then
            ARGS="$ARGS --csv"
          elif [ "${{ inputs.output-format }}" = "sarif" ] || [ "${{ inputs.sarif-upload }}" = "true" ]; then
            ARGS="$ARGS --sarif"
          fi
          echo "driftcheck_args=$ARGS" >> $GITHUB_OUTPUT

      - name: Run driftcheck
        id: driftcheck
        run: |
          set +e
          driftcheck "${{ inputs.path }}" ${{ steps.args.outputs.driftcheck_args }}
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "drift=true" >> $GITHUB_OUTPUT
          else
            echo "drift=false" >> $GITHUB_OUTPUT
          fi
          if [ "${{ inputs.fail-on-drift }}" = "true" ]; then
            exit $EXIT_CODE
          fi
          exit 0

      - name: Upload SARIF
        if: inputs.sarif-upload || inputs.output-format == 'sarif'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: driftcheck.sarif
          wait-for-processing: false

      - name: Post to job summary
        if: always() && steps.driftcheck.outputs.drift != 'true'
        run: |
          echo "## ✅ Driftcheck: No drift found" >> $GITHUB_STEP_SUMMARY
