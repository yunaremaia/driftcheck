name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      # Rule selection, target version and the linted path all come from
      # pyproject.toml, so this command and a local `ruff check src/` enforce
      # the identical gate. src/ only - never tests/.
      - run: ruff check src/
      # A second, narrower gate over tests/: F821 (undefined name) ONLY.
      # tests/ stays out of the full pyflakes gate above so this gate can never
      # pressure a change into weakening or deleting a test, but an undefined
      # name is a NameError the moment it runs - a defect, not a style opinion -
      # so it is worth catching. The inline --config only rewrites `include`
      # (which is what excludes tests/ from the gate above); target-version and
      # every other setting still come from pyproject.toml. Do not replace it
      # with --isolated, which would drop target-version and start flagging
      # version-gated builtins. Do not widen this to F: that reintroduces the
      # ~150 findings of F401/F811 style debt the src/ gate is scoped to avoid.
      - run: ruff check --select=F821 --config 'include = ["tests/**/*.py"]' tests/
      # `ruff format --check` is deliberately not run: formatting the tree is a
      # separate, reviewable change (see BACKLOG.md).
      - run: ruff check --select=F --statistics src/

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        exclude:
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e . && pip install pytest pytest-cov
      # --cov and the coverage floor come from pyproject.toml, not from here,
      # so a local `pytest -q` and CI enforce the identical gate.
      - run: pytest -q
      - run: python -m driftcheck --help

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install mkdocs mkdocs-material
      - run: mkdocs build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, docs]
    runs-on: ubuntu-latest
    # GitHub allows a single in-flight Pages deployment per repository, and
    # actions/deploy-pages does not queue: a second concurrent create fails with
    # "due to in progress deployment ... or wait for it to complete". Merging a
    # batch of PRs lands several pushes on main within a minute, so without this
    # group whichever deployment arrives second fails even though its build and
    # tests are green. The group serializes them and cancel-in-progress drops the
    # superseded one instead of publishing a stale build.
    #
    # This belongs on the job, not the workflow: a workflow-level group would
    # also cancel the test matrix of a newer commit whenever an older commit
    # reaches this step.
    concurrency:
      group: pages-deploy-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
