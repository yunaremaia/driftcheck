name: 'driftcheck'
description: 'Detect version drift between docs and toolchain files'
author: 'Yunare Maia'
branding:
  icon: 'alert-triangle'
  color: 'yellow'

inputs:
  path:
    description: 'Repository root to scan'
    required: false
    default: '.'
  detectors:
    description: 'Comma-separated list of detectors to run (default: all)'
    required: false
    default: ''
  exclude:
    description: 'Comma-separated list of detectors to exclude'
    required: false
    default: ''
  args:
    description: 'Extra CLI arguments (e.g., "--no-informational")'
    required: false
    default: ''
  sarif:
    description: 'Generate SARIF output and upload to GitHub Code Scanning'
    required: false
    default: 'false'
  sarif-output:
    description: 'Output SARIF file path'
    required: false
    default: 'driftcheck.sarif'
  fail-on-drift:
    description: 'Fail the step if blocking drifts are found (default: true)'
    required: false
    default: 'true'
  fail-on-informational:
    description: 'Treat informational drifts as blocking'
    required: false
    default: 'false'
  output-format:
    description: 'Output format: text, json, csv, sarif'
    required: false
    default: 'text'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Cache driftcheck
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip/driftcheck
        key: ${{ runner.os }}-driftcheck-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-driftcheck-

    - name: Install driftcheck
      shell: bash
      run: pip install git+https://github.com/yunaremaia/driftcheck.git

    - name: Build driftcheck args
      id: build-args
      shell: bash
      run: |
        ARGS="${{ inputs.args }}"
        if [ -n "${{ inputs.detectors }}" ]; then
          ARGS="$ARGS --only ${{ inputs.detectors }}"
        fi
        if [ -n "${{ inputs.exclude }}" ]; then
          ARGS="$ARGS --exclude ${{ inputs.exclude }}"
        fi
        if [ "${{ inputs.fail-on-informational }}" != "true" ]; then
          ARGS="$ARGS --no-informational"
        fi
        if [ "${{ inputs.output-format }}" = "json" ]; then
          ARGS="$ARGS --json"
        elif [ "${{ inputs.output-format }}" = "csv" ]; then
          ARGS="$ARGS --csv"
        elif [ "${{ inputs.output-format }}" = "sarif" ] || [ "${{ inputs.sarif }}" = "true" ]; then
          ARGS="$ARGS --sarif"
        fi
        echo "driftcheck_args=$ARGS" >> $GITHUB_OUTPUT

    - name: Run driftcheck
      id: driftcheck
      shell: bash
      run: |
        set +e
        DRIFT_ARGS="${{ steps.build-args.outputs.driftcheck_args }}"
        if echo "$DRIFT_ARGS" | grep -q "\-\-sarif"; then
          driftcheck "${{ inputs.path }}" $DRIFT_ARGS > "${{ inputs.sarif-output }}" 2>&1
          exit_code=$?
        else
          driftcheck "${{ inputs.path }}" $DRIFT_ARGS
          exit_code=$?
        fi
        echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
        if [ "$exit_code" -ne 0 ]; then
          echo "drift=true" >> "$GITHUB_OUTPUT"
        else
          echo "drift=false" >> "$GITHUB_OUTPUT"
        fi
        if [ "${{ inputs.fail-on-drift }}" = "true" ]; then
          exit $exit_code
        fi
        exit 0

    - name: Upload SARIF
      if: inputs.sarif == 'true' || inputs.output-format == 'sarif'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-output }}
        wait-for-processing: false

    - name: Post to job summary
      if: always() && steps.driftcheck.outputs.drift != 'true'
      shell: bash
      run: |
        echo "## ✅ Driftcheck: No blocking drift found" >> $GITHUB_STEP_SUMMARY
